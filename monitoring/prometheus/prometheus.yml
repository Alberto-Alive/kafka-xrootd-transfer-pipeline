global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Scrape Prometheus itself (nice for debugging)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the Kafka consumer that exposes xrootd_* metrics
  - job_name: 'xrootd-consumer'
    static_configs:
      - targets: ['consumer:8000']
